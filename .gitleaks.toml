# gitleaks config — reject secrets, tokens, keys, and dev-machine leakage.
# Plan section 11 (no home paths, no dev tokens, no shell history in
# source/artifacts) + section 12 (secret scanning on every change).
title = "hearth gitleaks"

[[rules]]
id = "github-pat"
description = "GitHub personal access token"
regex = '''\bghp_[A-Za-z0-9]{36,}\b'''
tags = ["github", "secret"]

[[rules]]
id = "github-oauth"
description = "GitHub OAuth token"
regex = '''\bgho_[A-Za-z0-9]{36,}\b'''
tags = ["github", "secret"]

[[rules]]
id = "github-fine-grained"
description = "GitHub fine-grained token"
regex = '''\bgithub_pat_[A-Za-z0-9_]{82}\b'''
tags = ["github", "secret"]

[[rules]]
id = "openai-key"
description = "OpenAI API key"
regex = '''\bsk-[A-Za-z0-9]{20,}T3BlbkFJ[A-Za-z0-9]{20,}\b|\bsk-proj-[A-Za-z0-9_-]{40,}\b|\bsk-[A-Za-z0-9]{40,}\b'''
tags = ["secret"]

[[rules]]
id = "anthropic-key"
description = "Anthropic API key"
regex = '''\bsk-ant-[A-Za-z0-9_-]{40,}\b'''
tags = ["secret"]

[[rules]]
id = "aws-access-key"
description = "AWS access key ID"
regex = '''\bAKIA[0-9A-Z]{16}\b'''
tags = ["aws", "secret"]

[[rules]]
id = "private-key-block"
description = "PEM private key block"
regex = '''-----BEGIN (RSA |EC |OPENSSH |DSA )?PRIVATE KEY-----'''
tags = ["secret"]

[[rules]]
id = "macos-users-path"
description = "Committed macOS home path outside the workdir"
regex = '''/Users/(?!blake\.sabatinelli/Desktop/hearth)'''
tags = ["portability"]

[[rules]]
id = "home-assistant-token"
description = "Home Assistant long-lived access token"
regex = '''\beyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'''
tags = ["home-assistant", "secret"]