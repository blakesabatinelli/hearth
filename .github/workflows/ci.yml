name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: lint + typecheck + test + portability
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint placeholder
        run: |
          echo 'lint stub; real lint config in Stage 1'

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r --if-present test

      - name: Verify Bonsai lock structure
        run: node scripts/verify-bonsai-lock.mjs

      - name: Verify portability
        run: node scripts/verify-portability.mjs

      - name: Secret scan via gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  no-live-credentials:
    name: ensure no live home credentials committed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify no JWT-shaped strings in source
        run: |
          set -e
          if grep -rE 'eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}' \
             --include='*.ts' --include='*.mjs' --include='*.json' --include='*.yaml' --include='*.yml' --include='*.md' \
             --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
             . ; then
            echo '::error::Found JWT-shaped string in source - may be a HA token. Verify and remove if so.'
            exit 1
          fi
      - name: Verify no private RFC1918 addresses in source
        run: |
          set -e
          if grep -rE '\b10\.[0-9]+\.[0-9]+\.[0-9]+\b|\b192\.168\.[0-9]+\.[0-9]+\b|\b172\.(1[6-9]|2[0-9]|3[01])\.[0-9]+\.[0-9]+\b' \
             --include='*.ts' --include='*.mjs' --include='*.json' --include='*.yaml' --include='*.yml' \
             --exclude-dir=node_modules --exclude-dir=dist --exclude-dir=.git \
             . ; then
            echo '::error::Found an RFC1918 address. Use documentation-safe placeholders in templates and installation-local addresses in runtime config.'
            exit 1
          fi
